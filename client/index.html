<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1"
    />
    <meta
      name="description"
      content="CinePulse helps you search movies, save favorites, and use AI to find films that match your mood and runtime preferences."
    />
    <meta name="theme-color" content="#0b1020" />
    <meta property="og:title" content="CinePulse - Modern Movie Discovery" />
    <meta
      property="og:description"
      content="Search movies, build a favorites list, and discover films that match your vibe."
    />
    <meta property="og:type" content="website" />
    <title>CinePulse - Modern Movie Discovery</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
    <script type="module">
      const endpoint = import.meta.env.VITE_ANALYTICS_ENDPOINT;
      const websiteId = import.meta.env.VITE_ANALYTICS_WEBSITE_ID;

      if (endpoint && websiteId) {
        const script = document.createElement("script");
        script.defer = true;
        script.src = `${endpoint}/umami`;
        script.setAttribute("data-website-id", websiteId);
        document.head.appendChild(script);
      }
    </script>
  </body>
</html>
